<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F0F0F" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tarefas" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <title>Tarefas</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --black: #0F0F0F;
      --dark: #202020;
      --green: #5DD62C;
      --darkgreen: #337418;
      --white: #F8F8F8;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Syne', sans-serif;
      min-height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      padding: 0 0 100px 0;
      overflow-x: hidden;
    }

    /* HEADER */
    .header {
      padding: 56px 24px 20px;
      position: sticky;
      top: 0;
      background: var(--black);
      z-index: 10;
    }
    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--white);
      letter-spacing: -0.5px;
    }
    .header .date {
      font-family: 'Space Mono', monospace;
      font-size: 11px;
      color: var(--green);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .reset-badge {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      background: var(--darkgreen);
      color: var(--green);
      padding: 4px 8px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .reset-badge::before { content: '●'; font-size: 6px; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

    /* PROGRESS */
    .progress-wrap {
      padding: 0 24px 20px;
    }
    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #666;
      font-family: 'Space Mono', monospace;
      margin-bottom: 8px;
    }
    .progress-label span:last-child { color: var(--green); }
    .progress-bar {
      height: 4px;
      background: var(--dark);
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--darkgreen), var(--green));
      border-radius: 99px;
      transition: width 0.5s cubic-bezier(.4,0,.2,1);
    }

    /* ADD TASK */
    .add-section {
      padding: 0 16px 24px;
    }
    .input-card {
      background: var(--dark);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    .task-input {
      flex: 1;
      background: var(--black);
      border: 1.5px solid #2a2a2a;
      border-radius: 12px;
      color: var(--white);
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      padding: 13px 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .task-input::placeholder { color: #444; }
    .task-input:focus { border-color: var(--darkgreen); }

    .add-btn {
      background: var(--green);
      border: none;
      border-radius: 12px;
      width: 48px;
      height: 48px;
      font-size: 24px;
      color: var(--black);
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s, background 0.2s;
      flex-shrink: 0;
    }
    .add-btn:active { transform: scale(0.92); background: var(--darkgreen); }

    /* CHECKLIST IN INPUT */
    .checklist-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .checklist-input-row {
      display: flex;
      gap: 8px;
    }
    .checklist-input {
      flex: 1;
      background: var(--black);
      border: 1.5px solid #2a2a2a;
      border-radius: 10px;
      color: var(--white);
      font-family: 'Syne', sans-serif;
      font-size: 13px;
      padding: 10px 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    .checklist-input::placeholder { color: #3a3a3a; }
    .checklist-input:focus { border-color: var(--darkgreen); }
    .checklist-add-btn {
      background: transparent;
      border: 1.5px solid var(--darkgreen);
      border-radius: 10px;
      color: var(--green);
      font-size: 18px;
      width: 38px;
      height: 38px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .checklist-add-btn:active { background: var(--darkgreen); }

    .checklist-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .checklist-tag {
      background: #1a2a12;
      border: 1px solid var(--darkgreen);
      border-radius: 8px;
      padding: 4px 10px;
      font-size: 12px;
      color: var(--green);
      font-family: 'Space Mono', monospace;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .checklist-tag button {
      background: none;
      border: none;
      color: #555;
      font-size: 14px;
      cursor: pointer;
      padding: 0;
      line-height: 1;
    }
    .checklist-tag button:active { color: #f55; }

    /* SECTION LABEL */
    .section-label {
      padding: 0 24px 12px;
      font-family: 'Space Mono', monospace;
      font-size: 10px;
      color: #3a3a3a;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* TASK CARDS */
    .tasks-list {
      padding: 0 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card {
      background: var(--dark);
      border-radius: var(--radius);
      overflow: hidden;
      transition: opacity 0.3s;
      border: 1.5px solid transparent;
    }
    .task-card.completed { border-color: var(--darkgreen); opacity: 0.6; }

    .task-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 16px 14px;
    }
    .task-check {
      width: 24px;
      height: 24px;
      border-radius: 8px;
      border: 2px solid #333;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }
    .task-check.done {
      background: var(--green);
      border-color: var(--green);
    }
    .task-check.done::after {
      content: '';
      width: 5px;
      height: 9px;
      border-right: 2px solid var(--black);
      border-bottom: 2px solid var(--black);
      transform: rotate(45deg) translate(-1px, -1px);
    }

    .task-title {
      flex: 1;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.3;
      transition: color 0.2s;
    }
    .task-card.completed .task-title {
      text-decoration: line-through;
      color: #555;
    }

    .task-delete {
      background: none;
      border: none;
      color: #333;
      font-size: 18px;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .task-delete:active { color: #f55; }

    /* CHECKLIST INSIDE CARD */
    .checklist-wrap {
      padding: 0 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .checklist-divider {
      height: 1px;
      background: #1a1a1a;
      margin: 0 16px 14px;
    }

    .check-item {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .check-dot {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 2px solid #2a2a2a;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }
    .check-dot.done {
      background: var(--darkgreen);
      border-color: var(--darkgreen);
    }
    .check-dot.done::after {
      content: '';
      width: 4px;
      height: 7px;
      border-right: 2px solid var(--green);
      border-bottom: 2px solid var(--green);
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .check-label {
      font-size: 13px;
      color: #aaa;
      transition: color 0.2s, text-decoration 0.2s;
      flex: 1;
    }
    .check-dot.done ~ .check-label {
      text-decoration: line-through;
      color: #444;
    }

    /* MINI PROGRESS */
    .mini-progress {
      height: 3px;
      background: #1a1a1a;
      border-radius: 99px;
      overflow: hidden;
      margin: 0 16px 14px;
    }
    .mini-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--darkgreen), var(--green));
      border-radius: 99px;
      transition: width 0.4s ease;
    }

    /* EMPTY STATE */
    .empty {
      text-align: center;
      padding: 48px 24px;
      color: #2a2a2a;
    }
    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty p { font-size: 14px; font-family: 'Space Mono', monospace; line-height: 1.7; }

    /* BOTTOM NAV */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      background: rgba(15,15,15,0.95);
      backdrop-filter: blur(20px);
      border-top: 1px solid #1a1a1a;
      padding: 12px 24px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .bar-stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .bar-stat .val {
      font-family: 'Space Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--green);
    }
    .bar-stat .lbl {
      font-family: 'Space Mono', monospace;
      font-size: 9px;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .bar-divider { width: 1px; height: 32px; background: #222; }

    /* ANIMATIONS */
    .task-card { animation: slideIn 0.3s cubic-bezier(.4,0,.2,1); }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--darkgreen);
      color: var(--green);
      font-family: 'Space Mono', monospace;
      font-size: 12px;
      padding: 10px 20px;
      border-radius: 99px;
      opacity: 0;
      transition: all 0.3s;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div>
      <div class="date" id="dateLabel"></div>
      <h1>Tarefas</h1>
    </div>
    <div class="reset-badge">Reset à 00:00</div>
  </div>
</div>

<div class="progress-wrap">
  <div class="progress-label">
    <span>Progresso do dia</span>
    <span id="progressPct">0%</span>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill" style="width:0%"></div>
  </div>
</div>

<div class="add-section">
  <div class="input-card">
    <div class="input-row">
      <input class="task-input" id="taskInput" placeholder="Nova tarefa…" maxlength="80" />
      <button class="add-btn" id="addBtn">+</button>
    </div>
    <div class="checklist-items" id="checklistItems"></div>
    <div class="checklist-input-row">
      <input class="checklist-input" id="checkInput" placeholder="Adicionar item ao checklist…" maxlength="60" />
      <button class="checklist-add-btn" id="checkAdd">+</button>
    </div>
    <div class="checklist-preview" id="checkPreview"></div>
  </div>
</div>

<div class="section-label">Hoje</div>
<div class="tasks-list" id="tasksList"></div>
<div class="empty" id="emptyState">
  <div class="empty-icon">🌿</div>
  <p>Nenhuma tarefa ainda.<br />Adicione algo acima!</p>
</div>

<div class="bottom-bar">
  <div class="bar-stat">
    <span class="val" id="statTotal">0</span>
    <span class="lbl">Total</span>
  </div>
  <div class="bar-divider"></div>
  <div class="bar-stat">
    <span class="val" id="statDone">0</span>
    <span class="lbl">Feitas</span>
  </div>
  <div class="bar-divider"></div>
  <div class="bar-stat">
    <span class="val" id="statPending">0</span>
    <span class="lbl">Pendentes</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ── STATE ──────────────────────────────────────────────
let tasks = [];
let pendingChecks = []; // checklist items being built

const STORAGE_KEY = 'taskapp_v2';

function saveState() {
  const today = getTodayStr();
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ date: today, tasks }));
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.date === getTodayStr()) {
      tasks = data.tasks || [];
    } else {
      // New day — reset checklists, keep tasks
      tasks = (data.tasks || []).map(t => ({
        ...t,
        done: false,
        checks: t.checks.map(c => ({ ...c, done: false }))
      }));
      saveState();
    }
  } catch (e) { tasks = []; }
}

function getTodayStr() {
  return new Date().toISOString().slice(0, 10);
}

// ── MIDNIGHT RESET ──────────────────────────────────────
function scheduleMidnightReset() {
  const now = new Date();
  const midnight = new Date();
  midnight.setHours(24, 0, 0, 0);
  const msUntilMidnight = midnight - now;
  setTimeout(() => {
    tasks = tasks.map(t => ({
      ...t,
      done: false,
      checks: t.checks.map(c => ({ ...c, done: false }))
    }));
    saveState();
    render();
    showToast('✨ Novo dia! Checklists resetados.');
    scheduleMidnightReset();
  }, msUntilMidnight);
}

// ── UI HELPERS ─────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

function updateDate() {
  const d = new Date();
  const opts = { weekday: 'long', day: 'numeric', month: 'long' };
  document.getElementById('dateLabel').textContent =
    d.toLocaleDateString('pt-BR', opts);
}

// ── RENDER ─────────────────────────────────────────────
function render() {
  const list = document.getElementById('tasksList');
  const empty = document.getElementById('emptyState');

  list.innerHTML = '';

  if (tasks.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    tasks.forEach((task, ti) => {
      const card = document.createElement('div');
      card.className = 'task-card' + (task.done ? ' completed' : '');

      // Main check + title
      const header = document.createElement('div');
      header.className = 'task-header';

      const check = document.createElement('div');
      check.className = 'task-check' + (task.done ? ' done' : '');
      check.addEventListener('click', () => toggleTask(ti));

      const title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = task.title;

      const del = document.createElement('button');
      del.className = 'task-delete';
      del.innerHTML = '×';
      del.addEventListener('click', () => deleteTask(ti));

      header.appendChild(check);
      header.appendChild(title);
      header.appendChild(del);
      card.appendChild(header);

      // Checklist items
      if (task.checks.length > 0) {
        const doneCount = task.checks.filter(c => c.done).length;
        const pct = Math.round((doneCount / task.checks.length) * 100);

        const divider = document.createElement('div');
        divider.className = 'checklist-divider';
        card.appendChild(divider);

        const miniBar = document.createElement('div');
        miniBar.className = 'mini-progress';
        miniBar.innerHTML = `<div class="mini-fill" style="width:${pct}%"></div>`;
        card.appendChild(miniBar);

        const wrap = document.createElement('div');
        wrap.className = 'checklist-wrap';

        task.checks.forEach((ci, cii) => {
          const row = document.createElement('div');
          row.className = 'check-item';

          const dot = document.createElement('div');
          dot.className = 'check-dot' + (ci.done ? ' done' : '');
          dot.addEventListener('click', () => toggleCheck(ti, cii));

          const lbl = document.createElement('span');
          lbl.className = 'check-label';
          lbl.textContent = ci.label;

          row.appendChild(dot);
          row.appendChild(lbl);
          wrap.appendChild(row);
        });

        card.appendChild(wrap);
      }

      list.appendChild(card);
    });
  }

  updateStats();
}

function updateStats() {
  const total = tasks.length;
  const done = tasks.filter(t => t.done).length;
  const pending = total - done;
  const pct = total ? Math.round((done / total) * 100) : 0;

  document.getElementById('statTotal').textContent = total;
  document.getElementById('statDone').textContent = done;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressPct').textContent = pct + '%';
}

// ── ACTIONS ────────────────────────────────────────────
function addTask() {
  const inp = document.getElementById('taskInput');
  const title = inp.value.trim();
  if (!title) { inp.focus(); return; }

  tasks.unshift({ title, done: false, checks: [...pendingChecks] });
  pendingChecks = [];
  inp.value = '';
  renderCheckPreview();
  saveState();
  render();
  showToast('Tarefa adicionada!');
}

function toggleTask(i) {
  tasks[i].done = !tasks[i].done;
  if (tasks[i].done && tasks[i].checks.length) {
    tasks[i].checks = tasks[i].checks.map(c => ({ ...c, done: true }));
    showToast('✅ Tarefa concluída!');
  }
  saveState();
  render();
}

function deleteTask(i) {
  tasks.splice(i, 1);
  saveState();
  render();
  showToast('Tarefa removida.');
}

function toggleCheck(ti, ci) {
  tasks[ti].checks[ci].done = !tasks[ti].checks[ci].done;
  // Auto-complete task if all checks done
  if (tasks[ti].checks.length > 0 && tasks[ti].checks.every(c => c.done)) {
    tasks[ti].done = true;
    showToast('✅ Tudo feito!');
  } else {
    tasks[ti].done = false;
  }
  saveState();
  render();
}

// ── CHECKLIST BUILDER ──────────────────────────────────
function addCheckItem() {
  const inp = document.getElementById('checkInput');
  const label = inp.value.trim();
  if (!label) return;
  pendingChecks.push({ label, done: false });
  inp.value = '';
  inp.focus();
  renderCheckPreview();
}

function renderCheckPreview() {
  const wrap = document.getElementById('checkPreview');
  wrap.innerHTML = '';
  pendingChecks.forEach((c, i) => {
    const tag = document.createElement('div');
    tag.className = 'checklist-tag';
    tag.innerHTML = `${c.label} <button onclick="removeCheck(${i})">×</button>`;
    wrap.appendChild(tag);
  });
}

function removeCheck(i) {
  pendingChecks.splice(i, 1);
  renderCheckPreview();
}

// ── EVENTS ─────────────────────────────────────────────
document.getElementById('addBtn').addEventListener('click', addTask);
document.getElementById('taskInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});
document.getElementById('checkAdd').addEventListener('click', addCheckItem);
document.getElementById('checkInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addCheckItem();
});

// ── INIT ───────────────────────────────────────────────
loadState();
updateDate();
render();
scheduleMidnightReset();

// Register SW
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
</html>
