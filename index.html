<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="theme-color" content="#0F0F0F"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Tarefas"/>
  <link rel="manifest" href="manifest.json"/>
  <link rel="apple-touch-icon" href="icons/icon-192.png"/>
  <title>Tarefas</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --black:     #0F0F0F;
      --dark:      #202020;
      --green:     #5DD62C;
      --darkgreen: #337418;
      --white:     #F8F8F8;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--black);
      color: var(--white);
      font-family: 'Syne', sans-serif;
      min-height: 100dvh;
      max-width: 430px;
      margin: 0 auto;
      padding-bottom: 110px;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    .header {
      padding: 52px 22px 16px;
      position: sticky; top: 0;
      background: var(--black);
      z-index: 20;
      border-bottom: 1px solid #1c1c1c;
    }
    .header-row { display: flex; align-items: flex-end; justify-content: space-between; }
    .header h1  { font-size: 30px; font-weight: 800; letter-spacing: -1px; line-height: 1; }
    .date-chip {
      font-family: 'Space Mono', monospace;
      font-size: 10px; color: var(--green);
      background: #0d1f06; border: 1px solid var(--darkgreen);
      border-radius: 99px; padding: 4px 10px;
      white-space: nowrap;
    }

    /* ── PROGRESS ── */
    .prog-wrap { padding: 14px 22px 0; }
    .prog-meta { display: flex; justify-content: space-between;
      font-family: 'Space Mono', monospace; font-size: 10px; color: #444; margin-bottom: 7px; }
    .prog-meta span:last-child { color: var(--green); }
    .prog-track { height: 3px; background: #1e1e1e; border-radius: 99px; overflow: hidden; }
    .prog-fill  { height: 100%; background: linear-gradient(90deg, var(--darkgreen), var(--green));
      border-radius: 99px; transition: width .5s cubic-bezier(.4,0,.2,1); }

    /* ── ADD ── */
    .add-wrap { padding: 18px 16px 14px; }
    .add-row  { display: flex; gap: 10px; }
    .add-input {
      flex: 1; background: var(--dark); border: 1.5px solid #2a2a2a;
      border-radius: 14px; color: var(--white);
      font-family: 'Syne', sans-serif; font-size: 15px;
      padding: 14px 16px; outline: none; transition: border-color .2s;
    }
    .add-input::placeholder { color: #3a3a3a; }
    .add-input:focus { border-color: var(--darkgreen); }
    .add-btn {
      width: 52px; height: 52px; flex-shrink: 0;
      background: var(--green); border: none; border-radius: 14px;
      font-size: 26px; font-weight: 700; color: var(--black);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform .15s, background .2s;
    }
    .add-btn:active { transform: scale(.9); background: var(--darkgreen); color: var(--green); }

    /* ── SECTION LABEL ── */
    .sec-label {
      padding: 4px 22px 10px;
      font-family: 'Space Mono', monospace; font-size: 10px;
      color: #333; text-transform: uppercase; letter-spacing: 2px;
    }

    /* ── TASK LIST ── */
    .tasks { padding: 0 16px; display: flex; flex-direction: column; gap: 10px; }

    .task-card {
      background: var(--dark); border-radius: 18px;
      display: flex; align-items: center; gap: 14px;
      padding: 16px 16px;
      border: 1.5px solid transparent;
      animation: popIn .25s cubic-bezier(.4,0,.2,1);
      transition: border-color .3s, opacity .3s;
    }
    .task-card.done {
      border-color: var(--darkgreen);
      opacity: .55;
    }
    @keyframes popIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .task-title {
      flex: 1; font-size: 15px; font-weight: 600; line-height: 1.35;
      transition: color .2s;
    }
    .task-card.done .task-title {
      text-decoration: line-through; color: #444;
    }

    /* STATUS BUTTON */
    .status-btn {
      flex-shrink: 0;
      padding: 7px 13px;
      border-radius: 99px; border: 1.5px solid;
      font-family: 'Space Mono', monospace; font-size: 11px;
      font-weight: 700; cursor: pointer;
      transition: background .2s, color .2s, border-color .2s, transform .15s;
      white-space: nowrap;
    }
    .status-btn.pending {
      background: transparent; color: #555; border-color: #2e2e2e;
    }
    .status-btn.pending:active { transform: scale(.93); }
    .status-btn.done {
      background: #0d1f06; color: var(--green); border-color: var(--darkgreen);
    }
    .status-btn.done:active { transform: scale(.93); }

    /* DELETE */
    .del-btn {
      flex-shrink: 0; background: none; border: none;
      color: #2e2e2e; font-size: 20px; cursor: pointer;
      padding: 4px; line-height: 1; transition: color .2s;
    }
    .del-btn:active { color: #c0392b; }

    /* ── EMPTY ── */
    .empty {
      text-align: center; padding: 52px 24px;
      color: #2a2a2a; display: none;
    }
    .empty-icon { font-size: 44px; margin-bottom: 14px; }
    .empty p { font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.9; }

    /* ── BOTTOM BAR ── */
    .bottom {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 430px;
      background: rgba(15,15,15,.96); backdrop-filter: blur(18px);
      border-top: 1px solid #1a1a1a;
      padding: 12px 32px 28px;
      display: flex; align-items: center; justify-content: space-around;
    }
    .bstat { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .bstat .val { font-family: 'Space Mono', monospace; font-size: 22px; font-weight: 700; color: var(--green); }
    .bstat .lbl { font-family: 'Space Mono', monospace; font-size: 9px; color: #3a3a3a; text-transform: uppercase; letter-spacing: 1px; }
    .bdiv { width: 1px; height: 28px; background: #1e1e1e; }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 88px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--darkgreen); color: var(--green);
      font-family: 'Space Mono', monospace; font-size: 11px;
      padding: 9px 18px; border-radius: 99px;
      opacity: 0; pointer-events: none; white-space: nowrap;
      transition: opacity .25s, transform .25s; z-index: 99;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<div class="header">
  <div class="header-row">
    <h1>Tarefas</h1>
    <div class="date-chip" id="dateChip"></div>
  </div>
</div>

<div class="prog-wrap">
  <div class="prog-meta">
    <span>progresso do dia</span>
    <span id="progPct">0%</span>
  </div>
  <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
</div>

<div class="add-wrap">
  <div class="add-row">
    <input class="add-input" id="addInput" placeholder="Nova tarefa…" maxlength="100"/>
    <button class="add-btn" id="addBtn" aria-label="Adicionar">+</button>
  </div>
</div>

<div class="sec-label" id="secLabel"></div>
<div class="tasks" id="taskList"></div>
<div class="empty" id="emptyState">
  <div class="empty-icon">🌿</div>
  <p>Nenhuma tarefa ainda.<br/>Adicione uma acima!</p>
</div>

<div class="bottom">
  <div class="bstat"><span class="val" id="stTotal">0</span><span class="lbl">Total</span></div>
  <div class="bdiv"></div>
  <div class="bstat"><span class="val" id="stDone">0</span><span class="lbl">Feitas</span></div>
  <div class="bdiv"></div>
  <div class="bstat"><span class="val" id="stPend">0</span><span class="lbl">Pendentes</span></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── STORAGE KEY ───────────────────────────────────────
const KEY = 'tarefas_v3';

// ─── STATE ─────────────────────────────────────────────
// Task shape: { id, title, done }
// Tasks NEVER deleted on day change — only .done resets to false
let tasks = [];

function todayStr() {
  return new Date().toISOString().slice(0, 10);
}

function save() {
  localStorage.setItem(KEY, JSON.stringify({ date: todayStr(), tasks }));
}

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    tasks = (data.tasks || []).map(t => ({
      id: t.id || Date.now() + Math.random(),
      title: t.title,
      // if stored date != today → reset done to false
      done: data.date === todayStr() ? t.done : false
    }));
  } catch(e) { tasks = []; }
}

// ─── MIDNIGHT RESET ────────────────────────────────────
function scheduleMidnight() {
  const now  = new Date();
  const next = new Date(); next.setHours(24,0,5,0); // 00:00:05 next day
  setTimeout(() => {
    tasks = tasks.map(t => ({ ...t, done: false }));
    save(); render();
    showToast('✨ Novo dia — tarefas resetadas!');
    scheduleMidnight();
  }, next - now);
}

// ─── ACTIONS ───────────────────────────────────────────
function addTask() {
  const inp = document.getElementById('addInput');
  const title = inp.value.trim();
  if (!title) { inp.focus(); return; }
  tasks.unshift({ id: Date.now(), title, done: false });
  inp.value = '';
  save(); render();
  showToast('Tarefa adicionada!');
}

function toggleDone(id) {
  const t = tasks.find(t => t.id === id);
  if (!t) return;
  t.done = !t.done;
  save(); render();
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  save(); render();
  showToast('Removida.');
}

// ─── RENDER ────────────────────────────────────────────
function render() {
  const list  = document.getElementById('taskList');
  const empty = document.getElementById('emptyState');
  list.innerHTML = '';

  if (tasks.length === 0) {
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
    tasks.forEach(t => {
      const card = document.createElement('div');
      card.className = 'task-card' + (t.done ? ' done' : '');

      const title = document.createElement('div');
      title.className = 'task-title';
      title.textContent = t.title;

      const btn = document.createElement('button');
      btn.className = 'status-btn ' + (t.done ? 'done' : 'pending');
      btn.textContent = t.done ? '✓ Feita' : 'Pendente';
      btn.addEventListener('click', () => toggleDone(t.id));

      const del = document.createElement('button');
      del.className = 'del-btn';
      del.innerHTML = '×';
      del.setAttribute('aria-label', 'Excluir');
      del.addEventListener('click', () => deleteTask(t.id));

      card.appendChild(title);
      card.appendChild(btn);
      card.appendChild(del);
      list.appendChild(card);
    });
  }

  updateStats();
  updateDate();
}

function updateStats() {
  const total = tasks.length;
  const done  = tasks.filter(t => t.done).length;
  const pct   = total ? Math.round(done / total * 100) : 0;
  document.getElementById('stTotal').textContent  = total;
  document.getElementById('stDone').textContent   = done;
  document.getElementById('stPend').textContent   = total - done;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progPct').textContent  = pct + '%';
  document.getElementById('secLabel').textContent =
    total ? `${total} tarefa${total !== 1 ? 's' : ''}` : '';
}

function updateDate() {
  const d = new Date();
  document.getElementById('dateChip').textContent =
    d.toLocaleDateString('pt-BR', { weekday: 'short', day: 'numeric', month: 'short' });
}

// ─── TOAST ─────────────────────────────────────────────
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

// ─── EVENTS ────────────────────────────────────────────
document.getElementById('addBtn').addEventListener('click', addTask);
document.getElementById('addInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') addTask();
});

// ─── INIT ──────────────────────────────────────────────
load();
render();
scheduleMidnight();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}
</script>
</body>
</html>
